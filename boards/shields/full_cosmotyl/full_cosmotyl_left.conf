CONFIG_ZMK_POINTING=y

CONFIG_ZMK_DISPLAY=y

# Leave ZMK's built-in blank-on-idle off: the nice_view_adapter on nice_nano_v2
# doesn't wire DISP_EN, so the stock path can't actually power the panel down —
# it would only stop the LVGL tick loop (which then prevents our own on-wake
# redraw from flushing). The custom status widget subscribes to
# zmk_activity_state_changed and blanks/restores the canvases itself.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Go idle (display blank) after 5 minutes of no activity. Any key press resets
# this timer and transitions back to ACTIVE, which repaints the screen.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Custom status screen (provided by this shield), disable the stock nice_view widget
# so our zmk_display_status_screen() is the only one linked.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# HID indicators (CAPS / NUM / SCR LED state from host)
CONFIG_ZMK_HID_INDICATORS=y

# Fetch peripheral battery level from the right half so we can render both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Fonts used by the custom status widget (nice_view would normally select these
# via NICE_VIEW_WIDGET_STATUS; since we disabled that, pull them in explicitly).
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_26=y
