# Shield .conf file is not being picked up by the build (likely a naming mismatch
# with the split shield names full_cosmotyl_left / _right). Pass configs via
# cmake-args instead — same technique used previously for CONFIG_ZMK_STUDIO.
 include:
   - board: nice_nano_v2
     shield: full_cosmotyl_left nice_view_adapter nice_view
     cmake-args: -DCONFIG_ZMK_POINTING=y
   - board: nice_nano_v2
     shield: full_cosmotyl_right nice_view_adapter nice_view
     cmake-args: -DCONFIG_ZMK_POINTING=y
