include:
  - board: nice_nano_v2
    shield: nice_view_adapter nice_view full_cosmotyl_left
  - board: nice_nano_v2
    shield: full_cosmotyl_right
  # Upstream shield that erases persistent settings (BLE bonds, etc.) on boot.
  # Flash this to each half once to force a clean re-pair, then flash the
  # normal firmware back.
  - board: nice_nano_v2
    shield: settings_reset
